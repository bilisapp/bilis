<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Shop — error demo</title>
  <!-- Pinned: a demo that changes under you is no help when debugging. -->
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.min.js" crossorigin="anonymous"></script>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    button { display: block; margin: 8px 0; padding: 8px 12px; }
    button:disabled { opacity: .5; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font: 12px monospace; }
    fieldset { margin: 16px 0; }
    #log { font-family: monospace; white-space: pre-wrap; color: #555; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <h1>Acme Shop</h1>
  <p class="muted">Each button fails the way a real storefront does and reports it through the Sentry browser SDK. See README.md.</p>

  <form id="dsn-form">
    <fieldset>
      <legend>DSN</legend>
      <input id="dsn" name="dsn" placeholder="http://bilis_pk_…@bilis.test/1" autocomplete="off">
      <button type="submit">Use this DSN</button>
    </fieldset>
  </form>

  <p id="who"></p>
  <button id="view-cart" disabled>View cart summary (TypeError)</button>
  <button id="pay" disabled>Pay for order (PaymentDeclinedError, handled)</button>
  <button id="recommend" disabled>Load recommendations (chained error)</button>
  <button id="coupon" disabled>Apply coupon (unhandled promise rejection)</button>
  <button id="shipping" disabled>Estimate shipping (RangeError)</button>
  <div id="log"></div>

  <script src="js/setup.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
